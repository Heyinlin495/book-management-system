spring.application.name=book-management-system

# Server
server.port=8080

# Request Size Configuration (for avatar upload)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/book_management?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=wshyla
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
jwt.secret=bookManagementJwtSecretKeyForHs512SigningMustBeLongEnough1234567890
jwt.expirationMs=86400000

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example._025021238heyinlin.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Logging
logging.level.root=INFO
logging.level.com.example._025021238heyinlin=DEBUG
